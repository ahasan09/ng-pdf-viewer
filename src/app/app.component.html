<div class="container">
  <header>
    <h1>{{ title }}</h1>
  </header>

  <div class="controls">
    <div class="file-upload-section">
      <label for="file-input" class="label">Upload PDF:</label>
      <input
        id="file-input"
        type="file"
        accept=".pdf"
        (change)="onFileSelected($event)"
        class="file-input"
      />
    </div>

    <div class="url-section">
      <label for="url-input" class="label">Load from URL:</label>
      <input
        id="url-input"
        type="text"
        [(ngModel)]="pdfUrl"
        placeholder="Enter PDF URL"
        class="url-input"
      />
      <button (click)="loadFromUrl()" class="btn">Load</button>
    </div>
  </div>

  <div class="viewer-container">
    <div *ngIf="loading$ | async" class="loading">
      <p>Loading PDF...</p>
    </div>

    <div *ngIf="error$ | async as error" class="error">
      <p>{{ error }}</p>
    </div>

    <div *ngIf="(pdfSource$ | async) as pdfSrc; else noPdf" class="pdf-viewer">
      <ngx-extended-pdf-viewer
        [src]="pdfSrc"
        [useBrowserLocale]="true"
        [showBorders]="true"
      ></ngx-extended-pdf-viewer>
    </div>

    <ng-template #noPdf>
      <div *ngIf="(loading$ | async) === false" class="placeholder">
        <p>No PDF loaded. Upload a file or load from URL above.</p>
      </div>
    </ng-template>
  </div>

  <div class="navigation">
    <button (click)="previousPage()" class="btn">Previous</button>
    <span class="page-info">
      Page {{ currentPage$ | async }} of {{ pageCount$ | async }}
    </span>
    <button (click)="nextPage()" class="btn">Next</button>
  </div>
</div>
